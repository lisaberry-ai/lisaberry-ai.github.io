<script type="application/json" id="activity-content">
{
  "flow": "linear",
  "eyebrow": "Chem 1A Exam Prep",
  "intro": "Review key formulas, chemical nomenclature, and multi-step problem setups across three self-check decks. Flip each card to verify your work and mark any concepts you want to practice again.",
  "minutes": 8,
  "steps": [
    {
      "type": "cards",
      "id": "deck-moles-formulas",
      "prompt": "Deck 1: Moles, Molar Mass & Empirical Formulas",
      "body": "Test your recall of mole conversions, ionic formulas, mass percent, and empirical formula calculations.",
      "selfCheck": true,
      "cards": [
        {
          "front": "**Mass to Molecules**\n\nHow do you find the number of molecules in **89.9 g of ammonia (NH₃)** (molar mass = 17.03 g/mol)?",
          "back": "**3.18 × 10²⁴ molecules**\n\n- **Step 1 (Mass → Moles):** 89.9 g ÷ 17.03 g/mol = 5.28 mol NH₃\n- **Step 2 (Moles → Molecules):** 5.28 mol × (6.022 × 10²³ molecules/mol) = 3.18 × 10²⁴ molecules"
        },
        {
          "front": "**Equal Atoms vs. Sample Mass**\n\nYou have a sample of **zinc (Zn, 65.38 g/mol)** and a sample of **aluminum (Al, 26.98 g/mol)** containing the **exact same number of atoms**. How do their masses compare?",
          "back": "**The Zn sample is more than twice as massive as the Al sample.**\n\n- Equal numbers of atoms mean equal numbers of moles.\n- Because 65.38 g/mol ÷ 26.98 g/mol ≈ 2.42, the zinc sample has roughly 2.4 times the mass of the aluminum sample."
        },
        {
          "front": "**Polyatomic Ion Naming & Molar Mass**\n\nWhat is the chemical formula and molar mass of **barium nitrite**?",
          "back": "**Ba(NO₂)₂ — 229.35 g/mol**\n\n- Barium forms a **Ba²⁺** ion (137.33 g/mol) and **nitrite** is **NO₂⁻** (46.01 g/mol) — be careful not to confuse it with nitrate (NO₃⁻).\n- Molar mass = 137.33 + 2(46.01) = **229.35 g/mol**."
        },
        {
          "front": "**Law of Definite Proportions**\n\nA sample of a compound contains **23.0 g Na, 27.0 g Al, and 114 g F**. How many grams of sodium are in a **196-g sample** of the same compound?",
          "back": "**27.5 g Na**\n\n- **Total original mass:** 23.0 + 27.0 + 114 = 164.0 g\n- **Mass fraction of Na:** 23.0 g ÷ 164.0 g = 0.1402 (14.02%)\n- **Mass in 196 g sample:** 196 g × 0.1402 = **27.5 g Na**"
        },
        {
          "front": "**Empirical Formula from Mass Percent**\n\nA compound is **49.32% C, 43.84% O, and 6.85% H** by mass. What is its empirical formula?",
          "back": "**C₃H₅O₂**\n\n- **Assume 100 g and convert to moles:**\n  - C: 49.32 g ÷ 12.01 = 4.11 mol\n  - O: 43.84 g ÷ 16.00 = 2.74 mol\n  - H: 6.85 g ÷ 1.008 = 6.80 mol\n- **Divide by smallest (2.74):** C = 1.50, O = 1.00, H = 2.48 (≈ 2.50)\n- **Multiply by 2** to clear half-integers: **C₃H₅O₂**"
        },
        {
          "front": "**Mass-Loss Stoichiometry**\n\nWhen **5.23 g of M₂S₃(s)** is heated in air to form **MO₂(s)**, the sample mass decreases by **0.81 g**. How do you find the average atomic mass of element M?",
          "back": "**55.9 g/mol (Manganese)**\n\n- **Net molar mass change:** 1 mol M₂S₃ loses 3 mol S (96.18 g) and gains 4 mol O (64.00 g), losing **32.18 g/mol**.\n- **Moles M₂S₃:** 0.81 g ÷ 32.18 g/mol = 0.02517 mol\n- **Molar mass M₂S₃:** 5.23 g ÷ 0.02517 mol = 207.8 g/mol\n- **Solve for M:** 2M + 96.18 = 207.8 → **M = 55.9 g/mol**"
        }
      ]
    },
    {
      "type": "cards",
      "id": "deck-solutions-molarity",
      "prompt": "Deck 2: Solutions, Ion Concentration & Dilutions",
      "body": "Practice solution dilution equations, dissociated ion counts, titrations, and gravimetric precipitation.",
      "selfCheck": true,
      "cards": [
        {
          "front": "**Stock Solution Dilution**\n\nWhat volume of **18 M H₂SO₄** is needed to prepare **1.80 L of 0.205 M H₂SO₄**?",
          "back": "**21 mL (20.5 mL)**\n\n- Use **M₁V₁ = M₂V₂**:\n- (18 M) × V₁ = (0.205 M) × (1.80 L)\n- V₁ = 0.369 ÷ 18 = **0.0205 L = 20.5 mL** (rounds to **21 mL**)"
        },
        {
          "front": "**Moles of Dissociated Ions**\n\nHow many moles of **sulfate ions (SO₄²⁻)** are in **0.547 L of 0.715 M aluminum sulfate, Al₂(SO₄)₃**?",
          "back": "**1.17 mol SO₄²⁻**\n\n- **Moles of Al₂(SO₄)₃:** 0.547 L × 0.715 M = 0.391 mol\n- Each formula unit dissociates into **3 SO₄²⁻ ions**: 0.391 mol × 3 = **1.17 mol SO₄²⁻**"
        },
        {
          "front": "**Acid-Base Neutralization Titration**\n\nWhat volume of **0.25 M HNO₃** is required to react completely with **7.4 g of Ca(OH)₂** (molar mass = 74.1 g/mol)?",
          "back": "**800 mL (0.80 L)**\n\n- **Balanced equation:** 2 HNO₃ + Ca(OH)₂ → Ca(NO₃)₂ + 2 H₂O\n- **Moles Ca(OH)₂:** 7.4 g ÷ 74.1 g/mol = 0.10 mol\n- **Moles HNO₃ needed:** 0.10 mol × 2 = 0.20 mol\n- **Volume HNO₃:** 0.20 mol ÷ 0.25 M = **0.80 L = 800 mL**"
        },
        {
          "front": "**Gravimetric Precipitation Analysis**\n\nAll the chloride in a **4.106-g unknown metal chloride** sample is precipitated as AgCl using **70.90 mL of 0.2010 M AgNO₃**. What is the mass percent of Cl in the sample?",
          "back": "**12.30% Cl**\n\n- **Moles Ag⁺ = Moles Cl⁻:** 0.07090 L × 0.2010 M = 0.01425 mol Cl⁻\n- **Mass of Cl:** 0.01425 mol × 35.45 g/mol = 0.5052 g Cl\n- **Percent Cl:** (0.5052 g ÷ 4.106 g) × 100% = **12.30%**"
        },
        {
          "front": "**Excess Ion Molarity After Precipitation**\n\n**30.9 g KCl** (74.55 g/mol) is dissolved in **350 mL of 0.400 M AgNO₃** with no volume change. What is the final molarity of **Cl⁻** remaining in solution?",
          "back": "**0.783 M Cl⁻**\n\n- **Initial Cl⁻:** 30.9 g ÷ 74.55 g/mol = 0.4145 mol\n- **Initial Ag⁺ (limiting):** 0.350 L × 0.400 M = 0.140 mol\n- **Remaining Cl⁻:** 0.4145 − 0.140 = 0.2745 mol\n- **Final [Cl⁻]:** 0.2745 mol ÷ 0.350 L = **0.783 M**"
        }
      ]
    },
    {
      "type": "cards",
      "id": "deck-reactions-stoichiometry",
      "prompt": "Deck 3: Balancing Equations, Reaction Types & Limiting Reactants",
      "body": "Review equation balancing, reaction classification, redox balancing, and limiting reactant strategies.",
      "selfCheck": true,
      "cards": [
        {
          "front": "**Carbonate + Acid Reaction**\n\nWrite the balanced equation and coefficients for **sodium carbonate** reacting with **hydrochloric acid** to form **sodium chloride, carbon dioxide, and water**.",
          "back": "**Coefficients: 1, 2, 2, 1, 1**\n\n- **Balanced equation:**\n  1 Na₂CO₃ + 2 HCl → 2 NaCl + 1 CO₂ + 1 H₂O"
        },
        {
          "front": "**Classifying Aqueous Reactions**\n\nWhat type of reaction is shown below?\n\nZnBr₂(aq) + 2 AgNO₃(aq) → Zn(NO₃)₂(aq) + 2 AgBr(s)",
          "back": "**Precipitation reaction**\n\n- Soluble aqueous ions combine to form an **insoluble solid precipitate, AgBr(s)**.\n- It is **not** redox (all oxidation states stay constant: Zn²⁺, Ag⁺, Br⁻, NO₃⁻) and **not** acid-base (no H⁺ transfer)."
        },
        {
          "front": "**Balancing Redox Equations**\n\nBalance this redox reaction using the oxidation number method. What is the coefficient of **Cl⁻**?\n\nCr + Cl₂ → Cr³⁺ + Cl⁻",
          "back": "**Coefficient of Cl⁻ is 6**\n\n- **Oxidation:** Cr (0 → +3) loses **3 e⁻** per Cr atom.\n- **Reduction:** Cl₂ (0 → −1) gains **2 e⁻** per Cl₂ molecule.\n- **Equalize electrons (LCM = 6):**\n  2 Cr + 3 Cl₂ → 2 Cr³⁺ + **6 Cl⁻**"
        },
        {
          "front": "**Identifying the Limiting Reactant**\n\nFor **2 Ca₃(PO₄)₂ + 6 SiO₂ + 10 C → 6 CaSiO₃ + P₄ + 10 CO**, you start with **3410 g Ca₃(PO₄)₂** (310 g/mol), **1695 g SiO₂** (60.1 g/mol), and **660 g C** (12.0 g/mol). Which reactant is limiting?",
          "back": "**SiO₂ is the limiting reactant**\n\n- **Convert to moles and divide by coefficient:**\n  - Ca₃(PO₄)₂: (3410 ÷ 310) = 11.0 mol ÷ 2 = **5.50**\n  - SiO₂: (1695 ÷ 60.1) = 28.2 mol ÷ 6 = **4.70** *(smallest!)*\n  - C: (660 ÷ 12.0) = 55.0 mol ÷ 10 = **5.50**"
        },
        {
          "front": "**Limiting Reactant & Product Mass**\n\nIn **2 H₂S + SO₂ → 3 S + 2 H₂O**, **7.50 g H₂S** (34.08 g/mol) reacts with **12.75 g SO₂** (64.06 g/mol). How many grams of sulfur (**S**, 32.06 g/mol) form?",
          "back": "**10.6 g of sulfur**\n\n- **From H₂S:** (7.50 g ÷ 34.08 g/mol) = 0.220 mol H₂S × (3 mol S / 2 mol H₂S) = **0.330 mol S** *(limiting)*\n- **From SO₂:** (12.75 g ÷ 64.06 g/mol) = 0.199 mol SO₂ × (3 mol S / 1 mol SO₂) = 0.597 mol S\n- **Mass of S formed:** 0.330 mol × 32.06 g/mol = **10.6 g S**"
        }
      ]
    }
  ],
  "summary": {
    "body": "Great job working through all three Chemistry 1A flashcard decks! Download your PDF summary and review any cards you marked for extra practice before Exam 1."
  }
}

  display: block; margin: 0 0 16px;
  font-family: var(--font-heading); font-size: var(--fs-xl); line-height: 1.35; font-weight: 650;
  text-wrap: pretty; overflow-wrap: anywhere;
}
.q-hint { margin: -6px 0 14px; color: var(--ink-2); font-size: var(--fs-sm); }
.instructions { margin: -6px 0 14px; color: var(--ink-2); font-size: var(--fs-sm); display: flex; gap: 6px; align-items: flex-start; }
.instructions .icon svg { width: 16px; height: 16px; margin-top: 2px; }

.rich { overflow-wrap: anywhere; }
.rich > :last-child { margin-bottom: 0; }
.rich ul, .rich ol { margin: 0 0 12px; padding-left: 22px; }
.rich li { margin: 4px 0; }
.rich a, .feedback a { color: var(--accent-ink); text-underline-offset: 3px; }
.rich-h { margin: 18px 0 8px; font-family: var(--font-heading); font-size: var(--fs-lg); font-weight: 700; }
.callout { margin: 0 0 14px; padding: 12px 16px; border-left: 4px solid var(--accent-ink); background: var(--accent-soft); border-radius: 0 12px 12px 0; }
.step-body { margin-bottom: 16px; }
.fig { margin: 0 0 16px; }
.fig img { display: block; width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.fig figcaption { margin-top: 6px; font-size: var(--fs-sm); color: var(--ink-2); }

.feedback { margin-top: 16px; padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); }
.feedback.is-right { background: var(--success-soft); border-color: color-mix(in srgb, var(--success) 35%, transparent); }
.feedback.is-wrong { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.feedback.is-partial { background: var(--partial-soft); border-color: color-mix(in srgb, var(--partial) 35%, transparent); }
.feedback.is-neutral { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent-ink) 25%, transparent); }
.fb-verdict { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-weight: 700; font-size: var(--fs-lg); }
.feedback.is-right .fb-verdict { color: var(--success); }
.feedback.is-wrong .fb-verdict { color: var(--danger); }
.feedback.is-partial .fb-verdict { color: var(--partial); }
.feedback.is-neutral .fb-verdict { color: var(--accent-ink); }
.fb-text { margin: 0; }
.fb-text + .fb-text { margin-top: 8px; }
.fb-list { margin: 6px 0 0; padding-left: 20px; }
.fb-explain { margin: 12px 0 0; padding-top: 12px; border-top: 1px solid rgb(var(--ink-rgb) / 0.12); color: var(--ink-2); font-size: var(--fs-sm); }
.fb-explain p:last-child { margin-bottom: 0; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 22px; }
.actions .push { margin-left: auto; }
.btn {
  appearance: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 22px;
  border: 1px solid transparent; border-radius: var(--radius-btn);
  font-weight: 650; font-size: var(--fs-md); line-height: 1.2; text-align: center;
  /* Keep the natural one-line width and move to a new row when it does not fit;
     only a label wider than the whole row wraps. */
  flex: 0 0 auto; max-width: 100%;
  cursor: pointer; text-decoration: none;
  transition: filter .15s, background-color .15s, border-color .15s, box-shadow .15s, transform .15s;
}
.btn .icon svg { width: 18px; height: 18px; }
.btn-primary {
  background-color: var(--accent-fill); /* solid underneath, so the label's contrast never depends on the gradient */
  background-image: linear-gradient(135deg, var(--accent-fill), var(--accent-fill-2));
  color: var(--on-accent);
  box-shadow: 0 10px 22px -12px rgb(var(--accent-rgb) / 0.9), inset 0 1px 0 rgb(255 255 255 / 0.18);
}
.btn-primary:hover { filter: brightness(1.07) saturate(1.05); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:hover { background: var(--surface-2); }
.mini-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; flex: none;
  border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer;
}
.mini-btn:disabled { opacity: 0.45; cursor: default; }
.mini-btn .icon svg { width: 18px; height: 18px; }
.inline-msg { margin: 12px 0 0; color: var(--danger); font-weight: 600; font-size: var(--fs-sm); }
.inline-msg:empty { display: none; }
.status-line { margin: 12px 0 0; font-size: var(--fs-sm); color: var(--ink-2); font-variant-numeric: tabular-nums; }

.field { margin-top: 8px; }
.field-label { display: block; margin-bottom: 6px; font-weight: 650; font-size: var(--fs-sm); }
.field-area, .field-input {
  width: 100%;
  padding: 12px 14px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
}
.field-area { min-height: 136px; resize: vertical; line-height: 1.5; }
.field-area[readonly] { background: var(--surface-2); }
.field-meta { margin: 6px 0 0; font-size: var(--fs-xs); color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px;
  font-size: var(--fs-xs); font-weight: 650; white-space: nowrap;
}
.tag .icon svg { width: 13px; height: 13px; stroke-width: 2.6; }
.tag.is-right { background: var(--success); color: var(--on-success); }
.tag.is-wrong { background: var(--danger); color: var(--on-danger); }

/* ═══ 5. choose ═══════════════════════════════════════════════════════════ */
.options { display: grid; gap: 10px; }
.opt {
  position: relative;
  display: flex; align-items: flex-start; gap: 12px;
  min-height: 52px; padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-opt);
  cursor: pointer;
  transition: border-color .15s, background-color .15s, box-shadow .15s, transform .15s;
}
.opt:hover { border-color: var(--line-strong); }
.opt:not(.is-locked):hover { transform: translateY(-1px); box-shadow: 0 8px 18px -12px rgb(var(--ink-rgb) / 0.35); }
.opt-input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.opt.is-focus { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt-mark {
  flex: none; width: 22px; height: 22px; margin-top: 1px;
  display: grid; place-items: center;
  border-radius: 50%; border: 2px solid var(--line-strong);
  transition: border-color .15s, background-color .15s;
}
.opt.is-multi .opt-mark { border-radius: 6px; }
.opt-mark .icon svg { width: 14px; height: 14px; stroke-width: 2.6; }
.opt-body { flex: 1; min-width: 0; }
.opt-text { display: block; overflow-wrap: anywhere; }
.opt-tag {
  display: inline-flex; margin-top: 8px; padding: 2px 9px; border-radius: 99px;
  font-size: var(--fs-xs); font-weight: 650;
}
.opt.is-selected { border-color: var(--accent-ink); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-ink); }
.opt.is-selected:hover { box-shadow: inset 0 0 0 1px var(--accent-ink), 0 8px 18px -12px rgb(var(--accent-rgb) / 0.6); }
.opt.is-selected .opt-mark { border-color: var(--accent-ink); background: radial-gradient(circle, var(--accent-ink) 0 5px, transparent 5.5px); }
.opt.is-multi.is-selected .opt-mark { background: var(--accent-ink); color: var(--surface); }
.opt.is-locked { cursor: default; transform: none !important; }
.opt.is-locked:not(.is-right):not(.is-wrong) .opt-text { color: var(--ink-2); }
.opt.is-right { border-color: var(--success); background: var(--success-soft); box-shadow: inset 0 0 0 1px var(--success); }
.opt.is-right .opt-mark { border-color: var(--success); background: var(--success); color: var(--on-success); }
.opt.is-right .opt-tag { background: var(--success); color: var(--on-success); }
.opt.is-wrong { border-color: var(--danger); background: var(--danger-soft); box-shadow: inset 0 0 0 1px var(--danger); }
.opt.is-wrong .opt-mark { border-color: var(--danger); background: var(--danger); color: var(--on-danger); }
.opt.is-wrong .opt-tag { background: var(--danger); color: var(--on-danger); }

/* ═══ 6. fill, words ══════════════════════════════════════════════════════ */
.fill-text { line-height: 2.3; margin: 0 0 10px; }
.blank {
  display: inline-block; vertical-align: baseline; max-width: 100%; min-width: 5ch;
  padding: 3px 8px; line-height: 1.4;
  border: 0; border-bottom: 2px solid var(--line-strong); border-radius: 8px 8px 0 0;
  background: var(--surface-2); color: var(--ink);
}
.blank.is-right { border-bottom-color: var(--success); background: var(--success-soft); }
.blank.is-wrong { border-bottom-color: var(--danger); background: var(--danger-soft); }
.blank-fix { display: inline-flex; align-items: center; gap: 3px; margin: 0 4px; font-size: var(--fs-sm); font-weight: 650; color: var(--success); line-height: 1.4; }
.blank-fix .icon svg { width: 14px; height: 14px; }
.blank-mark { display: inline-grid; vertical-align: -3px; margin-left: 2px; }
.blank-mark .icon svg { width: 16px; height: 16px; stroke-width: 2.6; }
.blank-mark.is-right { color: var(--success); }
.blank-mark.is-wrong { color: var(--danger); }
.slot {
  display: inline-flex; align-items: center; justify-content: center; vertical-align: baseline;
  min-width: 8ch; min-height: 36px; max-width: 100%; padding: 2px 12px; line-height: 1.3;
  border: 2px dashed var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink-2);
  font-weight: 600; cursor: pointer;
}
.slot.is-filled { border-style: solid; border-color: var(--accent-ink); background: var(--accent-soft); color: var(--ink); }
.is-armed .slot:not(.is-filled), .slot.is-drop-hover { border-color: var(--accent-ink); background: var(--accent-soft); }
.slot.is-right { border-style: solid; border-color: var(--success); background: var(--success-soft); color: var(--ink); cursor: default; }
.slot.is-wrong { border-style: solid; border-color: var(--danger); background: var(--danger-soft); color: var(--ink); cursor: default; }
.bank { margin: 16px 0 0; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.bank-label { margin: 0 0 8px; font-size: var(--fs-xs); font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.bank-items { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; align-items: center; }
.bank-empty { font-size: var(--fs-sm); color: var(--ink-2); }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; max-width: 100%; padding: 6px 14px;
  border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 600; cursor: grab; text-align: left; overflow-wrap: anywhere;
  -webkit-user-select: none; user-select: none;
}
.chip-btn:hover { border-color: var(--accent-ink); }
.chip-btn[aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); border-color: var(--accent-fill); }
.chip-btn.is-right { border-color: var(--success); background: var(--success-soft); cursor: default; }
.chip-btn.is-wrong { border-color: var(--danger); background: var(--danger-soft); cursor: default; }
.chip-btn .icon svg { width: 15px; height: 15px; stroke-width: 2.4; }
.is-dragging { opacity: 0.4; }
.drag-ghost { position: fixed; z-index: 99; pointer-events: none; transform: translate(-50%, -50%) rotate(-2deg); box-shadow: 0 14px 30px -10px rgb(16 24 40 / 0.45); }

/* ═══ 7. sort ═════════════════════════════════════════════════════════════ */
.zones { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); margin-top: 14px; }
.zone { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); min-height: 128px; }
.zone-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left;
  padding: 10px 12px; border-radius: 10px; border: 2px dashed transparent; background: var(--surface-2);
  font-weight: 700; color: var(--ink); cursor: pointer;
}
.zone-count { font-size: var(--fs-xs); font-weight: 650; color: var(--ink-2); }
.is-armed .zone-btn, .zone-btn.is-drop-hover { border-color: var(--accent-ink); background: var(--accent-soft); }
.zone-items { display: flex; flex-wrap: wrap; gap: 6px; }
.pool { margin-top: 4px; }
.fix-note { display: block; font-size: var(--fs-xs); font-weight: 600; color: var(--danger); }

/* ═══ 8. order ════════════════════════════════════════════════════════════ */
.order-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.order-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
}
.order-item.is-drop-hover { border-color: var(--accent-ink); box-shadow: inset 0 2px 0 var(--accent-ink); }
.order-grip { color: var(--ink-2); cursor: grab; display: grid; place-items: center; touch-action: none; }
.order-pos { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: var(--fs-sm); font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.order-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.order-moves { display: flex; gap: 4px; }
.order-item.is-right { border-color: var(--success); background: var(--success-soft); }
.order-item.is-wrong { border-color: var(--danger); background: var(--danger-soft); }
.order-item.is-right .order-pos { background: var(--success); color: var(--on-success); }
.order-item.is-wrong .order-pos { background: var(--danger); color: var(--on-danger); }

/* ═══ 9. hotspot ══════════════════════════════════════════════════════════ */
.hs-wrap { position: relative; margin: 0 6px; } /* markers on the edge may overhang the image a little */
.hs-wrap img { display: block; width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.hs-marker {
  position: absolute; transform: translate(-50%, -50%); width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; padding: 0; border: 2px solid #fff; cursor: pointer;
  background: var(--accent-fill); color: var(--on-accent); font-weight: 750; font-size: var(--fs-sm);
  box-shadow: 0 4px 12px rgb(16 24 40 / 0.35), 0 0 0 4px rgb(var(--accent-rgb) / 0.25);
}
.hs-marker[aria-expanded="true"] { background: var(--ink); color: var(--surface); }
.hs-marker.is-seen:not([aria-expanded="true"]) { box-shadow: 0 4px 12px rgb(16 24 40 / 0.35); }
.hs-panel { margin-top: 12px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.hs-panel h3 { margin: 0 0 6px; font-size: var(--fs-lg); font-family: var(--font-heading); }
.hs-region { position: absolute; padding: 0; margin: 0; background: transparent; border: 3px solid transparent; border-radius: 10px; cursor: pointer; }
.hs-region.is-selected { border-color: var(--accent-ink); background: rgb(var(--accent-rgb) / 0.18); }
.hs-region.is-right { border-color: var(--success); background: color-mix(in srgb, var(--success) 22%, transparent); }
.hs-region.is-wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 18%, transparent); }

/* ═══ 10. cards, reveal, timeline ═════════════════════════════════════════ */
.flash-stage { perspective: 1200px; }
.flashcard {
  min-height: 210px; display: grid; place-items: center; gap: 10px; text-align: center;
  padding: 30px 22px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface);
  box-shadow: 0 14px 30px -20px rgb(var(--ink-rgb) / 0.4);
}
.flashcard.is-back { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent-ink) 30%, transparent); }
.flash-side { font-size: var(--fs-xs); font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.flash-face { font-size: var(--fs-lg); font-weight: 600; max-width: 46ch; }
.flash-face p { margin: 0 0 8px; }
.flash-face img { max-width: 100%; height: auto; border-radius: 10px; }
.flip { animation: flip .36s ease-in-out; }
@keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
.flash-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.flash-count { font-size: var(--fs-sm); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.flash-rate { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
.acc { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.acc-item + .acc-item { border-top: 1px solid var(--line); }
.acc-h { margin: 0; font-size: var(--fs-md); }
.acc-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
  padding: 15px 16px; border: 0; background: transparent; color: var(--ink); font-weight: 650; cursor: pointer;
}
.acc-btn:hover { background: var(--surface-2); }
.acc-btn .icon { transition: transform .2s; }
.acc-btn[aria-expanded="true"] .icon { transform: rotate(180deg); }
.acc-panel { padding: 0 16px 16px; }
/* The line and dots are real (hidden) elements, not ::before, so contrast tools can
   see that nothing sits behind the text. */
.tl { list-style: none; margin: 0 0 0 9px; padding: 4px 0 0 0; border-left: 2px solid var(--line); }
.tl-item { position: relative; padding: 0 0 22px 24px; }
.tl-dot { position: absolute; left: -10px; top: 5px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent-ink); }
.tl-date { display: inline-block; margin-bottom: 4px; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-ink); font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.04em; }
.tl-title { margin: 0 0 4px; font-family: var(--font-heading); font-size: var(--fs-lg); font-weight: 700; }

/* ═══ 11. memory, crossword ═══════════════════════════════════════════════ */
.mem-grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
.mem-card {
  width: 100%; aspect-ratio: 4 / 5; padding: 8px; display: grid; place-items: center; text-align: center;
  border-radius: 12px; border: 1px solid transparent; cursor: pointer; overflow-wrap: anywhere;
  font-weight: 650; font-size: var(--fs-sm); line-height: 1.3; color: var(--on-accent);
  background-color: var(--accent-fill);
  background-image: repeating-linear-gradient(45deg, rgb(255 255 255 / 0.12) 0 6px, transparent 6px 14px);
}
.mem-card.is-open { background: var(--surface); background-image: none; color: var(--ink); border-color: var(--accent-ink); }
.mem-card.is-matched { background: var(--success-soft); background-image: none; color: var(--ink); border-color: var(--success); cursor: default; }
.mem-card img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.cw { display: grid; gap: 18px; }
@media (min-width: 640px) { .cw { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.cw-grid { display: grid; width: 100%; margin: 0 auto; }
.cw-cell {
  aspect-ratio: 1; position: relative; display: grid; place-items: center;
  border: 1px solid var(--line-strong); margin: 0 -1px -1px 0; background: var(--surface);
  font-weight: 700; text-transform: uppercase; font-size: var(--fs-sm); color: var(--ink);
}
.cw-cell.is-void { border-color: transparent; background: transparent; }
.cw-cell.is-conflict { background: var(--danger-soft); }
.cw-cell.is-right { background: var(--success-soft); }
.cw-num { position: absolute; top: 1px; left: 2px; font-size: var(--fs-2xs); font-weight: 600; line-height: 1; color: var(--ink-2); }
.cw-clues h3 { margin: 0 0 8px; font-size: var(--fs-sm); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.cw-clues ol { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 10px; }
.cw-clue label { display: block; font-size: var(--fs-sm); margin-bottom: 4px; }
.cw-clue b { margin-right: 4px; }
.cw-input {
  width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  text-transform: uppercase; letter-spacing: 0.2em; font-weight: 700; font-variant-numeric: tabular-nums;
}
.cw-input.is-right { border-color: var(--success); background: var(--success-soft); }
.cw-input.is-wrong { border-color: var(--danger); background: var(--danger-soft); }

/* ═══ 12. scene, ending, reflect ══════════════════════════════════════════ */
.choices { display: grid; gap: 10px; }
.choice {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s;
}
.choice:hover { border-color: var(--accent-ink); transform: translateY(-1px); box-shadow: 0 8px 18px -12px rgb(var(--ink-rgb) / 0.35); }
.choice > span:first-child { flex: 1; }
.choice .icon { color: var(--accent-ink); }
.choice.is-chosen { border-color: var(--accent-ink); background: var(--accent-soft); cursor: default; transform: none; }
.rating { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px; font-weight: 700; font-size: var(--fs-sm); margin-bottom: 12px; }
.rating.is-best { background: var(--success-soft); color: var(--success); }
.rating.is-mixed { background: var(--partial-soft); color: var(--partial); }
.rating.is-poor { background: var(--danger-soft); color: var(--danger); }

/* ═══ 13. Summary ═════════════════════════════════════════════════════════ */
.screen-title { margin: 0 0 16px; font-family: var(--font-heading); font-size: var(--fs-xl); font-weight: 700; }
.score {

  background: linear-gradient(135deg, rgb(var(--accent-rgb) / 0.10), rgb(var(--accent-2-rgb) / 0.08));

.ring { width: 76px; height: 76px; flex: none; }
.ring circle { fill: none; stroke-width: 7; }

.ring .val { stroke: var(--accent-ink); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .6s ease-out; }
.score-big { margin: 0; font-family: var(--font-heading); font-size: var(--fs-2xl); font-weight: 750; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score-sub { margin: 2px 0 0; color: var(--ink-2); }

.review-q { margin: 0 0 6px; font-weight: 650; }
.review-a { margin: 0; color: var(--ink-2); font-size: var(--fs-sm); overflow-wrap: anywhere; }
.review-a q { quotes: "\201C" "\201D"; color: var(--ink); }
.verdict {
  display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; padding: 1px 8px 1px 6px;

}
.verdict .icon svg { width: 13px; height: 13px; stroke-width: 2.6; }
.verdict.is-right { color: var(--success); background: var(--success-soft); }
.verdict.is-wrong { color: var(--danger); background: var(--danger-soft); }
.verdict.is-partial { color: var(--partial); background: var(--partial-soft); }
.evidence { margin-top: 22px; padding: 20px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); }
.ev-title { margin: 0 0 4px; font-family: var(--font-heading); font-size: var(--fs-lg); font-weight: 700; }
.ev-text { margin: 0 0 14px; color: var(--ink-2); }
.ev-note { margin: 10px 0 0; font-size: var(--fs-xs); color: var(--ink-2); }
.evidence .actions { margin-top: 14px; }

.load-error { padding: 28px var(--pad-x); }
.load-error h1 { font-size: var(--fs-xl); margin: 0 0 8px; }
.load-error ul { padding-left: 20px; }

@media (max-width: 480px) {
  :root { --pad-x: 14px; }
  .bar { padding-top: 16px; padding-bottom: 14px; }
  .eyebrow { border-radius: 8px; }
  .card { margin: 0 10px 10px; padding: 18px 14px; }
  .q-prompt { font-size: var(--fs-lg); }
  .btn { padding: 0 18px; }
  .actions .btn-primary { flex: 1 0 auto; }
  .evidence { padding: 16px 14px; }
  .score { padding: 14px; gap: 14px; }
  .ring { width: 64px; height: 64px; }
  .flashcard { min-height: 180px; padding: 24px 16px; }
  .mem-grid { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
  .toc { margin: 0 10px 10px; }

      nodes.push(el('div', { class: 'score' }, [ring, el('div', null, [
        el('p', { class: 'score-big', text: r.right + ' of ' + r.total }),
        el('p', { class: 'score-sub', text: r.unit === 'questions correct' && r.total === 1 ? 'question correct' : r.unit })
      ])]));
    } else {
      nodes.push(el('div', { class: 'score' }, [el('div', null, [el('p', { class: 'score-big', style: 'font-size:var(--fs-xl)', text: 'All done' }), el('p', { class: 'score-sub', text: 'Nothing here is scored.' })])]));
    }
    nodes = nodes.concat(rich(CONTENT.summary && CONTENT.summary.body));
    var rows = [];
    reviewSteps().forEach(function (s, k) {
      var rv = T(s).review(s, ans(s));
      if (!rv) return;
      rows.push(el('li', null, [
        el('p', { class: 'review-q', text: (FLOW === 'branching' ? '' : (k + 1) + '. ') + plain(s.prompt || labelOf(s)) }),
        el('p', { class: 'review-a' }, [rv.text, rv.verdict ? el('span', { class: cls('verdict', 'is-' + rv.verdict) }, [icon(rv.verdict === 'right' ? 'check' : rv.verdict === 'partial' ? 'half' : 'x'), rv.verdict === 'right' ? 'Correct' : rv.verdict === 'partial' ? 'Partly right' : 'Not correct']) : null])
      ]));
    });
    if (rows.length) nodes.push(el('ol', { class: 'review', 'aria-label': 'Your answers' }, rows));

    var ev = CFG.evidence || {};
    if (ev.enabled !== false) {
      var nameInput = ev.askName !== false ? el('input', { class: 'field-input', id: 'ev-name', type: 'text', autocomplete: 'name', spellcheck: 'false' }) : null;
      if (nameInput) {
        nameInput.value = S.name || '';
        nameInput.addEventListener('input', function () { S.name = nameInput.value; saveSoon(); });
      }
      nodes.push(el('section', { class: 'evidence', 'aria-labelledby': 'ev-h' }, [
        el('h3', { class: 'ev-title', id: 'ev-h', text: 'Keep a copy' }),
        el('p', { class: 'ev-text', text: ev.instructions || 'Save a summary of your answers as a PDF to keep or submit.' }),
        nameInput ? el('div', { class: 'field' }, [el('label', { class: 'field-label', for: 'ev-name', text: 'Your name (printed on the summary)' }), nameInput]) : null,
        el('div', { class: 'actions' }, [el('button', { class: 'btn btn-primary', type: 'button', onclick: printEvidence }, [icon('printer'), 'Save or print my results'])]),
        el('p', { class: 'ev-note', text: 'Opens a printable summary in a new tab. In the print window, choose “Save as PDF.”' })
      ]));
    }
    nodes.push(el('div', { class: 'actions' }, [secondary(FLOW === 'branching' ? 'Try a different path' : 'Try again', restart, 'retry')]));
    return nodes;
  }

  /* ═══ 9. Evidence: a print-ready summary ═══════════════════════════════ */
  function summaryParts() {
    var r = results();
    var when = new Date().toLocaleString(CFG.lang || undefined, { year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
    var rows = reviewSteps().map(function (s) {
      var rv = T(s).review(s, ans(s));
      if (!rv) return '';
      var verdict = rv.verdict === 'right' ? 'Correct' : rv.verdict === 'partial' ? 'Partly right' : rv.verdict === 'wrong' ? 'Not correct' : '';
      return '<li><p class="q">' + escHTML(plain(s.prompt || labelOf(s))) + '</p><p class="a">' + escHTML(rv.text).replace(/\n/g, '<br>') + '</p>' + (verdict ? '<p class="v">' + verdict + '</p>' : '') + '</li>';
    }).join('');
    var name = (S.name || '').trim();
    var last = FLOW === 'branching' ? steps[S.path[S.path.length - 1]] : null;
    var scoreRow = FLOW === 'branching' && last && last.type === 'ending'
      ? '<div><dt>Ending</dt><dd>' + escHTML(plain(last.prompt)) + (last.rating ? ' (' + escHTML(last.rating) + ')' : '') + '</dd></div>'
      : r.total ? '<div><dt>Score</dt><dd>' + r.right + ' of ' + r.total + ' ' + (r.unit === 'points' ? 'points' : 'questions correct') + '</dd></div>' : '';
    return {
      title: CFG.title,
      body:
        '<header><p class="kicker">Activity summary</p><h1>' + escHTML(CFG.title) + '</h1>' +
        '<dl><div><dt>Name</dt><dd>' + (name ? escHTML(name) : '<span class="blank">________________________</span>') + '</dd></div>' +
        '<div><dt>Completed</dt><dd>' + escHTML(when) + '</dd></div>' + scoreRow +
        '</dl></header><ol class="answers">' + rows + '</ol>' +
        '<footer>Generated in the learner’s browser from ' + escHTML(location.origin + location.pathname) + '</footer>'
    };
  }
  var PRINT_CSS =
    '@page{margin:18mm}*{box-sizing:border-box}body{margin:0;font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#111}' +
    'main{max-width:720px;margin:0 auto;padding:32px 24px}.kicker{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#555}' +
    'h1{margin:4px 0 16px;font-size:24px;line-height:1.25}dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0 0 24px;padding:14px 16px;border:1px solid #ccc;border-radius:8px}' +
    'dt{font-size:12px;color:#555}dd{margin:0;font-weight:600}.blank{color:#999;font-weight:400}.answers{padding-left:20px;margin:0}' +
    '.answers li{padding:10px 0;border-bottom:1px solid #ddd;break-inside:avoid}.q{margin:0 0 4px;font-weight:600}.a{margin:0}.v{margin:4px 0 0;font-size:13px;color:#333}' +
    'footer{margin-top:24px;font-size:11px;color:#666}.tools{margin:0 0 20px;padding:14px 16px;background:#f3f4f7;border-radius:8px}' +
    '.tools button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;background:#141a26;color:#fff;cursor:pointer}.tools p{margin:8px 0 0;font-size:13px;color:#444}' +
    '@media print{.tools{display:none}main{padding:0}}';

  function printEvidence() {
    var parts = summaryParts();
    var w = null;
    try { w = window.open('', '_blank'); } catch (e) { w = null; }
    if (w && w.document) {
      w.document.open();
      w.document.write(
        '<!doctype html><html lang="' + escHTML(CFG.lang || 'en') + '"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
        '<title>Summary: ' + escHTML(parts.title) + '</title><style>' + PRINT_CSS + '</style></head><body><main>' +
        '<div class="tools"><button type="button" onclick="window.print()">Save as PDF or print</button><p>In the print window, choose “Save as PDF” as the destination.</p></div>' +
        parts.body + '</main><script>window.addEventListener("load",function(){setTimeout(function(){window.print()},300)});<\/script></body></html>'
      );
      w.document.close();
      announce('Your summary opened in a new tab.');
      return;
    }
    // Pop-up blocked: print the summary from inside the frame instead.
    var pr = document.getElementById('print-root');
    pr.innerHTML = '<style>' + PRINT_CSS + '</style><main>' + parts.body + '</main>';
    pr.hidden = false;
    root.classList.add('is-printing');
    var done = function () { root.classList.remove('is-printing'); pr.hidden = true; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    window.print();
  }

  /* ═══ 10. Go ════════════════════════════════════════════════════════════ */
  render(null); // no focus on first paint: stealing focus would scroll the LMS page
  Bridge.start();
  setTimeout(function () { root.classList.remove('is-booting'); }, 120);
})();
</script>
</body>
</html>
